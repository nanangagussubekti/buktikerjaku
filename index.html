<html lang="id">
<head>
<meta charset="utf-8">

<title>Grafik Tren Pagu per OPD — APBD Kab. Tulungagung 2026</title>

<style>
:root{
  --bg:#0a0f1a; --card:#111a2c; --line:rgba(120,155,215,.12);
  --txt:#e8eefb; --mut:#7f94b8;
  --sky:#38bdf8; --cyan:#22d3ee; --grn:#34d399; --amb:#fbbf24;
  --red:#f87171; --vio:#a78bfa; --gold:#ffd45e; --pink:#f472b6;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);
  background-image:
    radial-gradient(900px 500px at 10% 0%,rgba(56,189,248,.10),transparent 55%),
    radial-gradient(800px 500px at 95% 5%,rgba(167,139,250,.09),transparent 55%);
  background-attachment:fixed;
  color:var(--txt); padding:18px 20px 60px; min-height:100vh;
  -webkit-font-smoothing:antialiased;
}

/* ===== HEADER ===== */
.header{
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  padding:18px 22px;margin-bottom:16px;border-radius:16px;
  background:linear-gradient(120deg,rgba(25,40,70,.72),rgba(13,21,36,.68));
  border:1px solid var(--line);
  box-shadow:0 20px 50px -25px rgba(0,0,0,.9);
}
.brand{display:flex;align-items:center;gap:14px}
.brand-logo{
  width:48px;height:48px;border-radius:13px;display:grid;place-items:center;
  font-weight:800;font-size:15px;color:#04121f;
  background:linear-gradient(135deg,var(--sky),var(--cyan));
  box-shadow:0 0 24px rgba(56,189,248,.4);
}
.brand h1{font-size:18px;font-weight:800;letter-spacing:-.3px}
.brand p{font-size:12.5px;color:var(--mut);margin-top:4px}
.badge-periode{
  display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:11px;
  background:rgba(56,189,248,.10);border:1px solid rgba(56,189,248,.28);
  color:var(--sky);font-size:12.5px;font-weight:700;
}
.badge-periode .dot{width:8px;height:8px;border-radius:50%;background:var(--sky);
  box-shadow:0 0 10px var(--sky);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ===== TOOLBAR ===== */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.search{
  display:flex;align-items:center;gap:8px;height:42px;padding:0 14px;
  border-radius:11px;background:var(--card);border:1px solid var(--line);
  flex:1;max-width:380px;min-width:220px;
}
.search span{opacity:.5;font-size:14px}
.search input{
  flex:1;background:transparent;border:0;outline:0;color:var(--txt);
  font-size:13px;font-family:inherit;
}
.search input::placeholder{color:#5a6e8f}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chipbtn{
  padding:8px 14px;border-radius:9px;font-size:12px;font-weight:700;
  background:var(--card);border:1px solid var(--line);color:var(--mut);
  cursor:pointer;transition:.2s;font-family:inherit;
}
.chipbtn:hover{color:var(--txt);border-color:rgba(56,189,248,.4)}
.chipbtn.on{background:rgba(56,189,248,.15);color:var(--sky);border-color:rgba(56,189,248,.5)}
.spacer{flex:1}
select.sortsel{
  height:42px;padding:0 14px;border-radius:11px;font-size:12.5px;font-weight:600;font-family:inherit;
  background:var(--card);border:1px solid var(--line);color:var(--txt);cursor:pointer;outline:0;
}
select.sortsel option{background:#0d1526}
.count{
  padding:9px 14px;border-radius:10px;font-size:12px;font-weight:700;
  color:var(--cyan);background:rgba(34,211,238,.08);
  border:1px solid rgba(34,211,238,.25);white-space:nowrap;
}

/* ===== SUMMARY BAR ===== */
.summary{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:10px;margin-bottom:18px;
}
.sum{
  padding:14px 16px;border-radius:13px;background:var(--card);
  border:1px solid var(--line);border-left:3px solid var(--c,var(--sky));
}
.sum .lbl{font-size:10.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--mut)}
.sum .val{font-size:18px;font-weight:800;letter-spacing:-.4px;margin-top:6px;font-variant-numeric:tabular-nums}
.sum .sub{font-size:11px;color:var(--mut);margin-top:4px}

/* ===== GRID ===== */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(340px,1fr));
  gap:14px;
}

/* ===== CARD per OPD ===== */
.opdcard{
  position:relative;overflow:hidden;
  border-radius:15px;
  background:var(--card);
  border:1px solid var(--line);
  box-shadow:0 16px 35px -28px rgba(0,0,0,.95);
  transition:transform .25s,border-color .25s;
  display:flex;flex-direction:column;
}
.opdcard:hover{transform:translateY(-3px);border-color:rgba(56,189,248,.35)}
.opdcard::before{
  content:'';position:absolute;left:0;top:0;right:0;height:3px;
  background:var(--accent,var(--sky));
}
.opdcard.up{--accent:linear-gradient(90deg,#34d399,#22d3ee)}
.opdcard.down{--accent:linear-gradient(90deg,#f87171,#fb923c)}
.opdcard.flat{--accent:linear-gradient(90deg,#7f94b8,#a78bfa)}

.opdcard .oc-head{
  padding:14px 16px 10px;
  display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
}
.oc-title{
  flex:1;min-width:0;
}
.oc-name{
  font-size:13px;font-weight:700;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  margin-bottom:6px;
}
.oc-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pill{
  display:inline-block;padding:2.5px 8px;border-radius:6px;
  font-size:9.5px;font-weight:800;letter-spacing:.3px;
}
.pill.Dinas{background:rgba(56,189,248,.13);color:var(--sky)}
.pill.Badan{background:rgba(167,139,250,.13);color:var(--vio)}
.pill.Sekretariat{background:rgba(251,191,36,.13);color:var(--amb)}
.pill.Kecamatan{background:rgba(52,211,153,.13);color:var(--grn)}

.delta-badge{
  display:inline-flex;align-items:center;gap:3px;
  padding:4px 9px;border-radius:7px;
  font-size:11px;font-weight:800;letter-spacing:-.2px;
  white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
.delta-badge.up{background:rgba(52,211,153,.14);color:var(--grn)}
.delta-badge.down{background:rgba(248,113,113,.14);color:var(--red)}
.delta-badge.flat{background:rgba(120,155,215,.12);color:var(--mut)}

.oc-chart{
  position:relative;height:130px;
  padding:0 8px;
}
.oc-foot{
  padding:8px 16px 12px;
  display:flex;justify-content:space-between;gap:10px;
  border-top:1px solid rgba(120,155,215,.08);
  margin-top:4px;
}
.foot-item{
  flex:1;
  font-size:10.5px;color:var(--mut);
}
.foot-item .v{
  display:block;font-size:12px;font-weight:800;color:var(--txt);
  font-variant-numeric:tabular-nums;margin-top:3px;
}

/* empty state */
.empty{
  grid-column:1/-1;
  padding:60px 20px;text-align:center;
  background:var(--card);border:1px dashed var(--line);border-radius:15px;
  color:var(--mut);
}
.empty .ico{font-size:36px;opacity:.4;margin-bottom:12px}
.empty p{font-size:13px}

/* scrollbar */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(120,155,215,.22);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:rgba(120,155,215,.4)}

@media(max-width:860px){
  .grid{grid-template-columns:1fr}
  body{padding:12px 12px 50px}
  .brand h1{font-size:15px}
  .oc-chart{height:120px}
}
</style>

  jun:3905791513, jul:3905791513, agu:3905791513, sep:3905791513}
];

/* ================= UTIL ================= */
const $ = s => document.querySelector(s);
const fmt = n => new Intl.NumberFormat('id-ID',{maximumFractionDigits:0}).format(Math.round(n));
const rp = n => 'Rp ' + fmt(n);
const shortRp = n => {
  const a = Math.abs(n);
  const sign = n<0 ? '-' : '';
  if(a>=1e12) return sign+'Rp '+(a/1e12).toFixed(2).replace('.',',')+' T';
  if(a>=1e9)  return sign+'Rp '+(a/1e9).toFixed(2).replace('.',',')+' M';
  if(a>=1e6)  return sign+'Rp '+(a/1e6).toFixed(1).replace('.',',')+' Jt';
  return sign+'Rp '+fmt(a);
};
const pct = n => (n).toFixed(2).replace('.',',')+'%';
const trunc = (s,n)=> s.length>n ? s.slice(0,n-1)+'…' : s;
const shortName = n => n.replace(/^Dinas /,'').replace(/^Badan /,'').replace(/^Kecamatan /,'Kec. ').replace(/ dan /g,' & ');

/* enrich */
DATA.forEach(d => {
  d.delta = d.sep - d.jan;
  d.pct   = d.jan ? d.delta/d.jan*100 : 0;
  d.min   = Math.min(...MONTHS.map(m=>d[m]));
  d.max   = Math.max(...MONTHS.map(m=>d[m]));
});

/* ================= STATE ================= */
const state = { kat:'all', q:'', sort:'delta_desc' };
const chartInstances = {};

/* ================= SUMMARY ================= */
function renderSummary(rows){
  const totJan = rows.reduce((s,d)=>s+d.jan,0);
  const totSep = rows.reduce((s,d)=>s+d.sep,0);
  const delta  = totSep - totJan;
  const p      = totJan ? delta/totJan*100 : 0;

  const naik  = rows.filter(d=>d.delta>0).length;
  const turun = rows.filter(d=>d.delta<0).length;
  const tetap = rows.filter(d=>d.delta===0).length;

  $('#summary').innerHTML = `
    <div class="sum" style="--c:var(--sky)">
      <div class="lbl">Total Pagu Januari</div>
      <div class="val">${shortRp(totJan)}</div>
      <div class="sub">${rows.length} OPD</div>
    </div>
    <div class="sum" style="--c:var(--cyan)">
      <div class="lbl">Total Pagu September</div>
      <div class="val">${shortRp(totSep)}</div>
      <div class="sub">${rows.length} OPD</div>
    </div>
    <div class="sum" style="--c:${delta>=0?'var(--grn)':'var(--red)'}">
      <div class="lbl">Selisih Jan → Sep</div>
      <div class="val" style="color:${delta>=0?'var(--grn)':'var(--red)'}">
        ${delta>=0?'+':''}${shortRp(delta)}
      </div>
      <div class="sub">${delta>=0?'+':''}${pct(p)} dari Januari</div>
    </div>
    <div class="sum" style="--c:var(--grn)">
      <div class="lbl">OPD Naik / Turun / Tetap</div>
      <div class="val">${naik} <span style="color:var(--mut);font-weight:600">/</span> ${turun} <span style="color:var(--mut);font-weight:600">/</span> ${tetap}</div>
      <div class="sub">dari ${rows.length} OPD</div>
    </div>
  `;
}

/* ================= GRID ================= */
function sortRows(rows){
  const s = state.sort;
  const arr = [...rows];
  if(s==='delta_desc') return arr.sort((a,b)=>b.delta-a.delta);
  if(s==='delta_asc')  return arr.sort((a,b)=>a.delta-b.delta);
  if(s==='pct_desc')   return arr.sort((a,b)=>b.pct-a.pct);
  if(s==='pct_asc')    return arr.sort((a,b)=>a.pct-b.pct);
  if(s==='pagu_desc')  return arr.sort((a,b)=>b.sep-a.sep);
  if(s==='pagu_asc')   return arr.sort((a,b)=>a.sep-b.sep);
  if(s==='nama')       return arr.sort((a,b)=>a.nama.localeCompare(b.nama,'id'));
  return arr;
}

const getRows = () => {
  const q = state.q.trim().toLowerCase();
  return DATA.filter(d =>
    (state.kat==='all' || d.kat===state.kat) &&
    (!q || d.nama.toLowerCase().includes(q))
  );
};

function renderGrid(){
  const rows = sortRows(getRows());
  $('#count').textContent = rows.length + ' OPD';
  $('#badgeCount').textContent = rows.length + ' OPD';

  const grid = $('#grid');

  /* hancurkan chart lama */
  Object.keys(chartInstances).forEach(k=>{ 
    try { chartInstances[k].destroy(); } catch(e){} 
    delete chartInstances[k];
  });

  if(!rows.length){
    grid.innerHTML = `
      <div class="empty">
        <div class="ico">🔍</div>
        <p>Tidak ada OPD yang cocok dengan filter.</p>
      </div>`;
    return;
  }

  grid.innerHTML = rows.map((d,i)=>{
    const cls = d.delta>0 ? 'up' : (d.delta<0 ? 'down' : 'flat');
    const sign = d.delta>0 ? '+' : '';
    const deltaText = sign + shortRp(d.delta);
    const pctText = (d.pct>=0?'+':'')+pct(d.pct);
    const trendIcon = d.delta>0 ? '▲' : (d.delta<0 ? '▼' : '■');
    const canvasId = `c_${i}`;

    return `
      <div class="opdcard ${cls}">
        <div class="oc-head">
          <div class="oc-title">
            <div class="oc-name">${d.nama}</div>
            <div class="oc-meta">
              <span class="pill ${d.kat}">${d.kat}</span>
            </div>
          </div>
          <span class="delta-badge ${cls}" title="Perubahan Januari → September">
            ${trendIcon} ${deltaText}
          </span>
        </div>
        <div class="oc-chart"><canvas id="${canvasId}"></canvas></div>
        <div class="oc-foot">
          <div class="foot-item">
            Januari
            <span class="v">${shortRp(d.jan)}</span>
          </div>
          <div class="foot-item" style="text-align:center">
            Relatif
            <span class="v" style="color:${d.delta>0?'var(--grn)':(d.delta<0?'var(--red)':'var(--mut)')}">${pctText}</span>
          </div>
          <div class="foot-item" style="text-align:right">
            September
            <span class="v">${shortRp(d.sep)}</span>
          </div>
        </div>
      </div>
    `;
  }).join('');

  /* render chart setelah DOM ada */
  requestAnimationFrame(()=>{
    rows.forEach((d,i)=>{
      const canvas = document.getElementById(`c_${i}`);
      if(!canvas) return;

      const pts = MONTHS.map(m => d[m]);
      const minV = Math.min(...pts);
      const maxV = Math.max(...pts);
      const pad = (maxV - minV) * 0.18 || maxV * 0.03;

      /* warna garis berdasarkan tren */
      const lineColor = d.delta>0 ? '#34d399' : (d.delta<0 ? '#f87171' : '#a78bfa');
      const fillTop = d.delta>0 ? 'rgba(52,211,153,.22)' : (d.delta<0 ? 'rgba(248,113,113,.22)' : 'rgba(167,139,250,.22)');
      const fillBot = d.delta>0 ? 'rgba(52,211,153,.01)' : (d.delta<0 ? 'rgba(248,113,113,.01)' : 'rgba(167,139,250,.01)');

      const ctx = canvas.getContext('2d');
      const grad = ctx.createLinearGradient(0, 0, 0, canvas.parentElement.offsetHeight || 130);
      grad.addColorStop(0, fillTop);
      grad.addColorStop(1, fillBot);

      /* kecilkan label sumbu untuk chart mini */
      const isLarge = maxV >= 1e9;
      const tickFontSize = 9;

      chartInstances[`c_${i}`] = new Chart(canvas,{
        type:'line',
        data:{
          labels: MONTH_LABELS,
          datasets:[{
            data: pts,
            borderColor: lineColor,
            backgroundColor: grad,
            borderWidth: 2.2,
            fill: true,
            tension: 0.35,
            pointRadius: 2.5,
            pointHoverRadius: 5,
            pointBackgroundColor: '#0d1524',
            pointBorderColor: lineColor,
            pointBorderWidth: 1.5
          }]
        },
        options:{
          responsive:true,
          maintainAspectRatio:false,
          animation:{ duration: 500 },
          interaction:{ mode:'index', intersect:false },
          plugins:{
            legend:{ display:false },
            tooltip:{
              backgroundColor:'rgba(13,21,36,.96)',
              borderColor:'rgba(120,155,215,.3)',
              borderWidth:1,
              titleColor:'#e8eefb',
              titleFont:{size:11, weight:'700'},
              bodyColor:'#e8eefb',
              bodyFont:{size:11},
              padding:9,
              displayColors:false,
              callbacks:{
                title: c => `${MONTH_LABELS[c[0].dataIndex]} 2026`,
                label: c => {
                  const cur = c.raw;
                  const prev = c.dataIndex>0 ? pts[c.dataIndex-1] : null;
                  const lines = [` Pagu: ${rp(cur)}`];
                  if(prev!=null){
                    const dd = cur - prev;
                    if(dd !== 0){
                      lines.push(` Δ vs bln lalu: ${dd>=0?'+':''}${shortRp(dd)}`);
                    }
                  }
                  if(c.dataIndex === pts.length-1 && pts[0]){
                    const dt = cur - pts[0];
                    lines.push(` Total Δ Jan→Sep: ${dt>=0?'+':''}${shortRp(dt)}`);
                  }
                  return lines;
                }
              }
            }
          },
          scales:{
            x:{
              grid:{ display:false, drawBorder:false },
              ticks:{
                color:'#6b7f9e', font:{size: tickFontSize, weight:'600'},
                maxRotation: 0, autoSkip:false,
                padding: 2
              },
              border:{ display:false }
            },
            y:{
              grid:{ color:'rgba(140,170,215,.06)', drawBorder:false },
              ticks:{
                color:'#6b7f9e', font:{size: tickFontSize}, maxTicksLimit:3,
                callback: v => isLarge ? shortRp(v).replace('Rp ','') : (v/1e6).toFixed(0)+'Jt',
                padding: 4
              },
              border:{ display:false },
              min: minV - pad,
              max: maxV + pad
            }
          }
        }
      });
    });
  });
}

/* ================= EVENTS ================= */
$('#q').addEventListener('input', e=>{ state.q = e.target.value; renderGrid(); });

$('#chips').addEventListener('click', e=>{
  const b = e.target.closest('.chipbtn'); if(!b) return;
  document.querySelectorAll('#chips .chipbtn').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  state.kat = b.dataset.k;
  renderGrid();
});

$('#sortSel').addEventListener('change', e=>{
  state.sort = e.target.value;
  renderGrid();
});

/* ================= INIT ================= */
Chart.defaults.color = '#7f94b8';
Chart.defaults.font.family = "'Inter', system-ui, sans-serif";
Chart.defaults.borderColor = 'rgba(140,170,215,.08)';

renderSummary(DATA);
renderGrid();
</script>
</body>
